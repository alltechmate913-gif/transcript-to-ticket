[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-to-ticket"
version = "0.1.0"
description = "Turn noisy support-call transcripts into internal notes, ticket drafts, and follow-up emails — with PII redaction."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "alltechmate913-gif"}]
keywords = ["helpdesk", "transcripts", "ticketing", "support", "redaction"]
classifiers = [
    "Intended Audience :: Customer Service",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
t2t = "transcript_to_ticket.cli:main"

[tool.setuptools.packages.find]
include = ["transcript_to_ticket*"]
